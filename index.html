<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6c5ce7"><title>خَمِّن الرسمة</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<main class="app-shell">
<header class="topbar"><div class="brand"><span>✏️</span><span id="gameTitle"></span></div><div id="roundLabel" class="round-label"></div></header>
<section id="setupScreen" class="screen active"><div class="hero-card"><div class="hero-illustration">🎨</div><h1 id="startTitle"></h1><p id="startDescription"></p><div class="setup-grid"><label><span id="artistNameLabel"></span><input id="artistName" maxlength="24"></label><label><span id="durationLabel"></span><select id="duration"></select></label></div><button id="startButton" class="primary large"></button></div><div id="setupTip" class="tip"></div></section>
<section id="cardsScreen" class="screen"><div class="section-heading"><span class="step">١</span><div><h2 id="artistGreeting"></h2><p id="chooseCardSub"></p></div></div><div id="cards" class="cards"></div><button id="newCardsButton" class="secondary"></button></section>
<section id="drawScreen" class="screen"><div class="gamebar"><div class="timer" id="timer">01:00</div><div id="secretCard" class="secret-pill"></div><button id="finishDrawing" class="primary"></button></div><div class="canvas-wrap"><canvas id="drawingCanvas"></canvas></div><div class="tools"><button class="tool active" data-tool="pen"></button><button class="tool" data-tool="fill"></button><button class="tool" data-tool="eraser"></button><button id="undoButton" class="tool"></button><button id="clearButton" class="tool danger"></button><div class="colors"><button class="color selected" data-color="#292d3e" style="--color:#292d3e"></button><button class="color" data-color="#e74c3c" style="--color:#e74c3c"></button><button class="color" data-color="#f1c40f" style="--color:#f1c40f"></button><button class="color" data-color="#2ecc71" style="--color:#2ecc71"></button><button class="color" data-color="#3498db" style="--color:#3498db"></button><button class="color" data-color="#9b59b6" style="--color:#9b59b6"></button><input id="colorWheel" class="color-wheel" type="color" value="#ff7a00" title="عجلة الألوان"></div></div></section>
<section id="guessScreen" class="screen"><div class="section-heading centered"><span class="step">٢</span><div><h2><span id="guessTitle"></span> <span id="guessArtist"></span>؟</h2><p id="guessSub"></p></div></div><div class="guess-layout"><div class="canvas-preview"><canvas id="guessCanvas"></canvas></div><div class="guess-panel"><h3 id="guessOptionsTitle"></h3><div id="guessOptions" class="guess-options"></div><div class="custom-guess"><input id="customGuess"><button id="submitCustom" class="primary"></button></div><p id="guessMessage" class="message"></p></div></div></section>
<section id="resultScreen" class="screen"><div class="result-card"><div class="confetti">🎉</div><h2 id="resultTitle"></h2><p id="answerLabel"></p><div id="answer" class="answer"></div><p id="resultText"></p><button id="nextRound" class="primary large"></button><button id="restart" class="link-button"></button></div></section>
</main><footer id="footer"></footer><script src="app.js?v=3"></script></body></html>
